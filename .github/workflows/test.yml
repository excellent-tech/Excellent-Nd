name: Test

on:
  pull_request:
  push:
    branches:
      - codex/**
      - chatgpt/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m compileall -q scripts tests
      - run: python -m unittest -v
      - run: python scripts/build_plugin_package.py --check-only
      - run: python scripts/build_plugin_package.py --output dist/excellent-nd-plugin.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: excellent-nd-plugin
          path: |
            dist/excellent-nd-plugin.zip
            dist/excellent-nd-plugin.zip.sha256
          if-no-files-found: error
